# AgentFleet landing page and release downloads: static files only.
# The site is published at agentfleet.sync.com.lb. The former address,
# agentfleet.wecansync.com, shares the same document root (deploys update both)
# and keeps serving installers, scripts and releases directly, because installed
# copies use it; its pages send a permanent redirect to the new address.
#
# Install on the web host as /etc/apache2/sites-available/agentfleet.sync.com.lb.conf,
# then: a2ensite agentfleet.sync.com.lb && apache2ctl configtest && systemctl reload apache2
# The site is behind Cloudflare with Always Use HTTPS, so issue the certificate
# from the document root: certbot certonly --webroot -w /var/www/agentfleet.wecansync.com -d agentfleet.sync.com.lb
<VirtualHost *:80>
    ServerName agentfleet.sync.com.lb
    DocumentRoot /var/www/agentfleet.wecansync.com

    <Directory /var/www/agentfleet.wecansync.com>
        Options -Indexes -Includes -ExecCGI +SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted
    </Directory>

    # Scripts are served as text so browsers show them and nothing executes them.
    AddType "text/plain; charset=utf-8" .sh .ps1
    AddType "application/json; charset=utf-8" .json
    AddType "image/svg+xml" .svg

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'"

    # Mutable entry points must never be served stale.
    <FilesMatch "^(index\.html|install\.sh|install\.ps1|latest\.json)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    # Published releases never change.
    <LocationMatch "^/releases/[0-9]+\.[0-9]+\.[0-9]+/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/agentfleet.sync.com.lb-error.log
    CustomLog ${APACHE_LOG_DIR}/agentfleet.sync.com.lb-access.log combined
</VirtualHost>

# The former address: add these lines to its port 80 and 443 virtual hosts
# (ServerName agentfleet.wecansync.com, same DocumentRoot as above).
#
#     RewriteEngine on
#     # Installed copies fetch these from the former address: never redirect them.
#     RewriteCond %{REQUEST_URI} !^/(releases/|install\.sh$|install\.ps1$|windows-check\.ps1$|\.well-known/)
#     RewriteRule ^ https://agentfleet.sync.com.lb%{REQUEST_URI} [R=301,L,NE]
